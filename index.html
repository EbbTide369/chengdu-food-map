"address": "乐山市牛华镇", "category": "其他", "icon": "📍", "color": "#7F8C8D", "lnglat": "103.802914,29.464398", "formatted": "四川省乐山市五通桥区牛华镇"}, {"name": "豆花面", "address": "成都市东教场街4号", "category": "其他", "icon": "📍", "color": "#7F8C8D", "lnglat": "104.112226,30.587766", "formatted": "四川省成都市东"}];</script>
<script>const NOT_FOUND = [{"name": "余实记", "address": "成都市", "category": "川菜火锅", "reason": "地理编码失败"}, {"name": "Godt & Co咖啡", "address": "成都市", "category": "咖啡甜点", "reason": "地理编码失败"}, {"name": "耀华糕点", "address": "成都市", "category": "烧烤小吃", "reason": "地理编码结果偏差(香港)"}];</script>
<script>const CATS = [{"id": "青羊区", "icon": "🏛️", "color": "#E74C3C", "label": "青羊区"}, {"id": "武侯区", "icon": "🌿", "color": "#27AE60", "label": "武侯区"}, {"id": "金牛区", "icon": "🐂", "color": "#F39C12", "label": "金牛区"}, {"id": "锦江区", "icon": "💧", "color": "#2980B9", "label": "锦江区"}, {"id": "成华区", "icon": "🏭", "color": "#8E44AD", "label": "成华区"}, {"id": "其他", "icon": "📍", "color": "#7F8C8D", "label": "其他地区"}];</script>
<script>
(function() {
var map;
var markers = {};
var activeCategories = new Set(CATS.map(function(c) { return c.id; }));
var activeInfoWindow = null;

function init() {
  map = new AMap.Map('map', {
    zoom: 12,
    center: [104.065, 30.657],
    mapStyle: 'amap://styles/dark',
    resizeEnable: true,
    viewMode: '3D'
  });

  POIS.forEach(function(poi, idx) {
    var parts = poi.lnglat.split(',').map(Number);
    var marker = new AMap.Marker({
      position: [parts[0], parts[1]],
      title: poi.name,
      icon: new AMap.Icon({
        size: new AMap.Size(22, 22),
        imageSize: new AMap.Size(22, 22),
        image: markerSVG(poi.color)
      }),
      offset: new AMap.Pixel(-11, -11),
      zIndex: 100,
      extData: { poi: poi, idx: idx }
    });
    marker.on('click', onMarkerClick);
    markers[idx] = marker;
    marker.setMap(map);
  });

  updateCounts();
  renderPOIList();
  renderNotFound();

  map.on('click', function() {
    if (window.innerWidth <= 768) {
      document.getElementById('sidebar').classList.remove('open');
    }
  });
}

function markerSVG(color) {
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" fill="COLOR" stroke="#fff" stroke-width="1.5" opacity="0.9"/><circle cx="11" cy="11" r="4" fill="#fff" opacity="0.3"/></svg>';
  svg = svg.replace('COLOR', color);
  return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
}

function onMarkerClick(e) {
  var poi = e.target.getExtData().poi;
  var parts = poi.lnglat.split(',').map(Number);
  var lng = parts[0], lat = parts[1];

  if (activeInfoWindow) {
    map.clearInfoWindow();
  }

  var addr = poi.formatted || poi.address;
  var content = '<div class="info-window"><h3>' + poi.icon + ' ' + poi.name + '</h3>';
  content += '<div style="color:#999;font-size:11px;">' + addr + '</div>';
  content += '<a class="nav-link" href="javascript:void(0)" onclick="openNav(' + lng + ',' + lat + ',\'' + poi.name.replace(/'/g, "\\'") + '\')">📍 高德导航 →</a>';
  content += '</div>';

  var infoWindow = new AMap.InfoWindow({
    content: content,
    offset: new AMap.Pixel(0, -28),
    closeWhenClickMap: true
  });
  infoWindow.open(map, [lng, lat]);
  activeInfoWindow = infoWindow;

  map.setCenter([lng, lat]);
  highlightSidebar(poi.name);
}

window.openNav = function(lng, lat, name) {
  var url = 'https://uri.amap.com/navigation?to=' + lng + ',' + lat + ',' + encodeURIComponent(name) + '&mode=car&callnative=1';
  window.open(url, '_blank');
};

function renderPOIList(filter) {
  filter = filter || '';
  var container = document.getElementById('poiList');
  var html = '';
  var lowerFilter = filter.toLowerCase();

  CATS.forEach(function(cat) {
    var catPois = POIS.filter(function(p) {
      if (p.category !== cat.id) return false;
      if (!filter) return true;
      return p.name.toLowerCase().indexOf(lowerFilter) !== -1;
    });
    if (catPois.length === 0 && filter) return;
    html += '<div class="cat-section" data-cat="' + cat.id + '">';
    html += '<div class="cat-header">' + cat.icon + ' ' + cat.label + ' (' + catPois.length + ')</div>';
    catPois.forEach(function(p) {
      var escapedName = p.name.replace(/'/g, "\\'").replace(/"/g, '&quot;');
      html += '<div class="poi-item" data-name="' + p.name.replace(/"/g, '&quot;') + '" onclick="focusPOI(\'' + escapedName + '\')">';
      html += '<span class="poi-icon">' + p.icon + '</span>';
      html += '<span class="poi-name">' + p.name + '</span>';
      html += '</div>';
    });
    html += '</div>';
  });

  if (!html) html = '<div style="padding:16px;color:#666;font-size:13px;">未找到匹配店铺</div>';
  container.innerHTML = html;
}

function renderNotFound() {
  var section = document.getElementById('notFoundSection');
  if (NOT_FOUND.length === 0) { section.style.display = 'none'; return; }
  var html = '<h3>⚠️ 未找到 (' + NOT_FOUND.length + '家)</h3>';
  NOT_FOUND.forEach(function(nf) {
    html += '<div class="not-found-item">' + (nf.icon || '') + ' ' + nf.name + ' <span style="color:#555">— ' + nf.reason + '</span></div>';
  });
  section.innerHTML = html;
}

window.focusPOI = function(name) {
  var poi = POIS.find(function(p) { return p.name === name; });
  if (!poi) return;
  var parts = poi.lnglat.split(',').map(Number);
  map.setCenter([parts[0], parts[1]]);
  map.setZoom(16);
  var idx = POIS.indexOf(poi);
  if (markers[idx]) {
    markers[idx].emit('click', { target: markers[idx] });
  }
};

function highlightSidebar(name) {
  document.querySelectorAll('.poi-item').forEach(function(el) {
    if (el.dataset.name === name) {
      el.classList.add('active');
    } else {
      el.classList.remove('active');
    }
  });
}

window.filterPOIs = function() {
  var val = document.getElementById('searchInput').value;
  renderPOIList(val);
};

window.toggleCategory = function(catId) {
  if (activeCategories.has(catId)) {
    activeCategories.delete(catId);
  } else {
    activeCategories.add(catId);
  }
  var item = document.querySelector('.legend-item[data-cat="' + catId + '"]');
  if (item) {
    if (activeCategories.has(catId)) {
      item.classList.remove('disabled');
    } else {
      item.classList.add('disabled');
    }
  }

  POIS.forEach(function(poi, idx) {
    if (poi.category === catId) {
      if (activeCategories.has(catId)) {
        markers[idx].setMap(map);
      } else {
        markers[idx].setMap(null);
      }
    }
  });

  if (!activeCategories.has(catId) && activeInfoWindow) {
    map.clearInfoWindow();
    activeInfoWindow = null;
  }
};

function updateCounts() {
  CATS.forEach(function(cat) {
    var count = POIS.filter(function(p) { return p.category === cat.id; }).length;
    var el = document.getElementById('count-' + cat.id);
    if (el) el.textContent = count + '家';
  });
}

window.toggleSidebar = function() {
  document.getElementById('sidebar').classList.toggle('open');
};

document.addEventListener('DOMContentLoaded', init);
})();
</script>

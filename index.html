<script>
(function() {
  var map;
  var markers = [];
  var markerVisible = [];
  var activeCategories = new Set(CATS.map(function(cat) { return cat.id; }));
  var activeInfoWindow = null;
  var activePoiIndex = null;
  var userPosition = null;
  var userMarker = null;
  var accuracyCircle = null;
  var watchId = null;
  var nearbyOnly = false;
  var radiusMeters = 3000;

  function coordinates(poi) {
    return poi.lnglat.split(',').map(Number);
  }

  function distanceMeters(a, b) {
    var rad = Math.PI / 180;
    var lat1 = a[1] * rad;
    var lat2 = b[1] * rad;
    var dLat = (b[1] - a[1]) * rad;
    var dLng = (b[0] - a[0]) * rad;
    var h = Math.sin(dLat / 2) ** 2 + Math.cos(lat1) * Math.cos(lat2) * Math.sin(dLng / 2) ** 2;
    return 6371000 * 2 * Math.atan2(Math.sqrt(h), Math.sqrt(1 - h));
  }

  function formatDistance(meters) {
    return meters < 1000 ? Math.round(meters) + ' 米' : (meters / 1000).toFixed(1) + ' 公里';
  }

  function init() {
    if (!window.AMap) {
      setStatus('地图加载失败，请刷新页面后重试。', true);
      return;
    }
    map = new AMap.Map('map', {
      zoom: 12,
      center: [104.065, 30.657],
      mapStyle: 'amap://styles/dark',
      resizeEnable: true,
      viewMode: '3D'
    });

    POIS.forEach(function(poi, index) {
      var marker = new AMap.Marker({
        position: coordinates(poi),
        title: poi.name,
        icon: new AMap.Icon({
          size: new AMap.Size(22, 22),
          imageSize: new AMap.Size(22, 22),
          image: markerSVG(poi.color)
        }),
        offset: new AMap.Pixel(-11, -11),
        zIndex: 100,
        extData: { index: index }
      });
      marker.on('click', function() { openPOI(index); });
      marker.setMap(map);
      markers[index] = marker;
      markerVisible[index] = true;
    });

    document.getElementById('mapStats').textContent = POIS.length + '家精选 · ' + CATS.length + '大区域 · 交互地图';
    CATS.forEach(function(cat) {
      var count = POIS.filter(function(poi) { return poi.category === cat.id; }).length;
      document.getElementById('count-' + cat.id).textContent = count + '家';
    });
    document.querySelectorAll('.legend-item').forEach(function(item) {
      item.addEventListener('click', function() { toggleCategory(item.dataset.cat); });
      item.setAttribute('role', 'button');
      item.setAttribute('tabindex', '0');
      item.setAttribute('aria-pressed', 'true');
      item.addEventListener('keydown', function(event) {
        if (event.key === 'Enter' || event.key === ' ') {
          event.preventDefault();
          toggleCategory(item.dataset.cat);
        }
      });
    });
    document.getElementById('searchInput').addEventListener('input', render);
    document.getElementById('radiusSelect').addEventListener('change', function(event) {
      radiusMeters = event.target.value === 'all' ? Infinity : Number(event.target.value);
      render();
    });
    document.getElementById('locateBtn').addEventListener('click', activateNearby);
    document.getElementById('map-locate-btn').addEventListener('click', activateNearby);
    document.getElementById('stopBtn').addEventListener('click', stopTracking);
    document.getElementById('allBtn').addEventListener('click', function() { setMode(false); });
    document.getElementById('nearbyBtn').addEventListener('click', function() { setMode(true); });
    document.getElementById('toggle-btn').addEventListener('click', function() { toggleSidebar(); });
    document.getElementById('close-sidebar-btn').addEventListener('click', function() { toggleSidebar(false); });
    map.on('click', function() {
      if (window.innerWidth <= 768) toggleSidebar(false);
    });
    renderNotFound();
    render();
  }

  function markerSVG(color) {
    var svg = '<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22"><circle cx="11" cy="11" r="10" fill="COLOR" stroke="#fff" stroke-width="1.5" opacity="0.9"/><circle cx="11" cy="11" r="4" fill="#fff" opacity="0.3"/></svg>';
    return 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg.replace('COLOR', color));
  }

  function getVisibleEntries() {
    var term = document.getElementById('searchInput').value.trim().toLowerCase();
    var entries = [];
    POIS.forEach(function(poi, index) {
      if (!activeCategories.has(poi.category)) return;
      if (term && !(poi.name + ' ' + poi.address).toLowerCase().includes(term)) return;
      var distance = userPosition ? distanceMeters(userPosition, coordinates(poi)) : null;
      if (nearbyOnly && (distance === null || distance > radiusMeters)) return;
      entries.push({ poi: poi, index: index, distance: distance });
    });
    if (nearbyOnly) entries.sort(function(a, b) { return a.distance - b.distance; });
    return entries;
  }

  function render() {
    if (!map) return;
    var entries = getVisibleEntries();
    var visible = new Set(entries.map(function(entry) { return entry.index; }));
    markers.forEach(function(marker, index) {
      var shouldShow = visible.has(index);
      if (shouldShow !== markerVisible[index]) {
        marker.setMap(shouldShow ? map : null);
        markerVisible[index] = shouldShow;
      }
    });
    if (activePoiIndex !== null && !visible.has(activePoiIndex)) {
      map.clearInfoWindow();
      activeInfoWindow = null;
      activePoiIndex = null;
    }

    var list = document.getElementById('poiList');
    list.replaceChildren();
    var fragment = document.createDocumentFragment();
    if (nearbyOnly) {

      entries.forEach(function(entry) { fragment.appendChild(createListItem(entry, true)); });
    } else {
      CATS.forEach(function(cat) {
        var catEntries = entries.filter(function(entry) { return entry.poi.category === cat.id; });
        if (!catEntries.length && document.getElementById('searchInput').value.trim()) return;
        var section = document.createElement('div');
        section.className = 'cat-section';
        var heading = document.createElement('div');
        heading.className = 'cat-header';
        heading.textContent = cat.icon + ' ' + cat.label + ' (' + catEntries.length + ')';
        section.appendChild(heading);
        catEntries.forEach(function(entry) { section.appendChild(createListItem(entry, false)); });
        fragment.appendChild(section);
      });
    }
    if (!entries.length) {
      var empty = document.createElement('div');
      empty.className = 'nearby-heading';
      empty.textContent = nearbyOnly ? '范围内没有收录餐馆，可扩大查找范围或切换“全部”。' : '没有匹配的餐馆。';
      fragment.appendChild(empty);
    }
    list.appendChild(fragment);
    if (userPosition) updateLocationStatus(entries.length);
  }

  function createListItem(entry, showDetail) {
    var item = document.createElement('button');
    item.type = 'button';
    item.className = 'poi-item' + (entry.index === activePoiIndex ? ' active' : '');
    item.dataset.index = entry.index;
    var icon = document.createElement('span');
    icon.className = 'poi-icon';
    icon.textContent = entry.poi.icon;
    var name = document.createElement('span');
    name.className = 'poi-name';
    name.textContent = entry.poi.name;
    if (showDetail) {
      var detail = document.createElement('span');
      detail.className = 'poi-detail';
      detail.textContent = entry.poi.category + ' · ' + entry.poi.address;
      name.appendChild(detail);
    }
    item.append(icon, name);
    if (showDetail && entry.distance !== null) {
      var distance = document.createElement('span');
      distance.className = 'poi-distance';
      distance.textContent = formatDistance(entry.distance);
      item.appendChild(distance);
    }
    item.addEventListener('click', function() {
      map.setZoom(16);
      openPOI(entry.index);
      if (window.innerWidth <= 768) toggleSidebar(false);
    });
    return item;
  }

  function navURL(poi, mode) {
    var params = new URLSearchParams();
    params.set('to', poi.lnglat + ',' + poi.name);
    if (userPosition) params.set('from', userPosition.join(',') + ',我的位置');
    params.set('mode', mode);
    params.set('callnative', '1');
    params.set('src', 'chengdu-food-map');
    return 'https://uri.amap.com/navigation?' + params.toString();
  }

  function openPOI(index) {
    var poi = POIS[index];
    var position = coordinates(poi);
    var content = document.createElement('div');
    content.className = 'info-window';
    var title = document.createElement('h3');
    title.textContent = poi.icon + ' ' + poi.name;
    var address = document.createElement('div');
    address.style.cssText = 'color:#aaa;font-size:11px;';
    address.textContent = poi.formatted || poi.address;
    content.append(title, address);
    if (userPosition) {
      var distance = document.createElement('div');
      distance.textContent = '距你约 ' + formatDistance(distanceMeters(userPosition, position)) + '（直线距离）';
      content.appendChild(distance);
    }
    [['步行路线', 'walk'], ['驾车路线', 'car']].forEach(function(option) {
      var link = document.createElement('a');
      link.className = 'nav-link';
      link.textContent = option[0];
      link.href = navURL(poi, option[1]);
      link.target = '_blank';
      link.rel = 'noopener noreferrer';
      content.appendChild(link);
    });
    if (activeInfoWindow) map.clearInfoWindow();
    activeInfoWindow = new AMap.InfoWindow({
      content: content,
      offset: new AMap.Pixel(0, -28),
      closeWhenClickMap: true
    });
    activeInfoWindow.open(map, position);
    activePoiIndex = index;
    map.setCenter(position);
    document.querySelectorAll('.poi-item').forEach(function(item) {
      item.classList.toggle('active', Number(item.dataset.index) === index);
    });
  }

  function toggleCategory(catId) {
    if (activeCategories.has(catId)) activeCategories.delete(catId);
    else activeCategories.add(catId);
    var item = document.querySelector('.legend-item[data-cat="' + catId + '"]');
    item.classList.toggle('disabled', !activeCategories.has(catId));
    item.setAttribute('aria-pressed', String(activeCategories.has(catId)));
    render();
  }

  function setMode(isNearby) {
    if (isNearby && !userPosition) {
      startTracking();
      return;
    }
    nearbyOnly = isNearby;
    document.getElementById('allBtn').classList.toggle('active', !isNearby);
    document.getElementById('nearbyBtn').classList.toggle('active', isNearby);
    document.getElementById('allBtn').setAttribute('aria-pressed', String(!isNearby));
    document.getElementById('nearbyBtn').setAttribute('aria-pressed', String(isNearby));
    render();
  }

  function setStatus(message, isError) {
    var status = document.getElementById('locationStatus');
    status.textContent = message;
    status.classList.toggle('error', !!isError);
  }

  function updateLocationStatus(count) {
    var suffix = watchId === null ? '已暂停实时更新' : '实时定位中';
    var precision = userPosition.accuracy ? ' · 精度约 ' + formatDistance(userPosition.accuracy) : '';
    var nearby = nearbyOnly ? ' · 范围内 ' + count + ' 家' : '';
    setStatus(suffix + precision + nearby + '；距离为直线距离。', false);
  }

  function activateNearby() {
    if (window.innerWidth <= 768) toggleSidebar(true);
    if (userPosition) {
      setMode(true);
      centerOnUser();
    }
    if (watchId === null) startTracking();
  }

  function startTracking() {
    if (!navigator.geolocation) {
      setStatus('此浏览器不支持定位，请使用支持定位的浏览器。', true);
      return;
    }
    if (watchId !== null) return;
    setStatus('正在获取位置，请允许浏览器访问定位…', false);
    document.getElementById('locateBtn').textContent = '📍 正在定位…';
    watchId = navigator.geolocation.watchPosition(onPosition, onLocationError, {
      enableHighAccuracy: true,
      maximumAge: 10000,
      timeout: 20000
    });
    document.getElementById('stopBtn').hidden = false;
  }

  function onPosition(position) {
    var gps = [position.coords.longitude, position.coords.latitude];
    AMap.convertFrom(gps, 'gps', function(status, result) {
      if (status !== 'complete' || !result.locations || !result.locations.length) {
        setStatus('获取到位置，但地图坐标转换失败。请稍后重试。', true);
        return;
      }
      var converted = result.locations[0];
      var firstFix = userPosition === null;
      userPosition = [converted.getLng(), converted.getLat()];
      userPosition.accuracy = position.coords.accuracy;
      updateUserMarker();
      document.getElementById('nearbyBtn').disabled = false;
      document.getElementById('locateBtn').textContent = '🎯 回到我的位置';
      if (firstFix) {
        setMode(true);
        centerOnUser();
      } else {
        render();
      }
    });
  }

  function updateUserMarker() {
    if (!userMarker) {
      userMarker = new AMap.Marker({
        position: userPosition,
        content: '<div class="user-position-dot" title="我的位置"></div>',
        offset: new AMap.Pixel(-9, -9),
        zIndex: 1000
      });
      userMarker.setMap(map);
    } else {
      userMarker.setPosition(userPosition);
    }
    if (accuracyCircle) accuracyCircle.setMap(null);
    if (userPosition.accuracy && userPosition.accuracy <= 3000) {
      accuracyCircle = new AMap.Circle({
        center: userPosition,
        radius: userPosition.accuracy,
        strokeColor: '#1689e8',
        strokeOpacity: 0.6,
        strokeWeight: 1,
        fillColor: '#1689e8',
        fillOpacity: 0.08,
        zIndex: 20
      });
      accuracyCircle.setMap(map);
    }
  }

  function centerOnUser() {
    if (!userPosition) return;
    map.setZoom(15);
    map.setCenter(userPosition);
  }

  function onLocationError(error) {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    document.getElementById('stopBtn').hidden = true;
    document.getElementById('locateBtn').textContent = userPosition ? '📍 重新定位' : '📍 定位并找附近';
    var messages = {
      1: '定位权限被拒绝，请在浏览器设置中允许此网站访问位置后重试。',
      2: '暂时无法获取位置，请检查设备定位服务和网络后重试。',
      3: '定位超时，请重试。'
    };
    setStatus(messages[error.code] || '定位失败，请重试。', true);
  }

  function stopTracking() {
    if (watchId !== null) navigator.geolocation.clearWatch(watchId);
    watchId = null;
    document.getElementById('stopBtn').hidden = true;
    document.getElementById('locateBtn').textContent = '📍 继续实时定位';
    if (userPosition) render();
  }

  function toggleSidebar(force) {
    var sidebar = document.getElementById('sidebar');
    sidebar.classList.toggle('open', typeof force === 'boolean' ? force : !sidebar.classList.contains('open'));
    document.getElementById('toggle-btn').setAttribute('aria-expanded', String(sidebar.classList.contains('open')));
  }

  function renderNotFound() {
    var section = document.getElementById('notFoundSection');
    if (!NOT_FOUND.length) {
      section.style.display = 'none';
      return;
    }
    var heading = document.createElement('h3');
    heading.textContent = '⚠️ 未找到 (' + NOT_FOUND.length + '家)';
    section.appendChild(heading);
    NOT_FOUND.forEach(function(poi) {
      var item = document.createElement('div');
      item.className = 'not-found-item';
      item.textContent = (poi.icon || '') + ' ' + poi.name + ' — ' + poi.reason;
      section.appendChild(item);
    });
  }

  document.addEventListener('DOMContentLoaded', init);
})();
</script>
</body>
</html>
